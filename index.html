<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Industrial Sales Command</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
input,select,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
#isc-error{display:none;position:fixed;inset:0;background:#0a0f1e;color:#ff4444;font-family:monospace;padding:40px;font-size:13px;z-index:9999;white-space:pre-wrap;overflow:auto}
textarea{resize:vertical}
@media (max-width:820px){
#root{height:auto!important}
body{overflow:auto!important}
#root>div{flex-direction:column!important;height:auto!important;min-height:100vh}
aside{width:100%!important;flex-direction:row!important;flex-wrap:wrap;border-right:none!important;border-bottom:1px solid #1e293b}
aside>div:first-child{display:none!important}
aside nav{flex-direction:row!important;flex-wrap:wrap;padding:4px!important}
aside nav button{width:auto!important}
main{overflow:visible!important}
main>div:last-child{overflow:visible!important;padding:10px!important}
main table{display:block;overflow-x:auto}
[style*="grid-template-columns"]{grid-template-columns:1fr!important}
[style*="position: fixed"]>div{width:94vw!important;max-width:94vw!important}
[style*="width: 270px"]{width:100%!important}
[style*="gap: 16px"][style*="height: 100%"]{flex-direction:column!important}
}
select option{background:#0f172a;color:#f0f4ff}
</style>
</head>
<body>
<div id="isc-error"></div>
<div id="root" style="height:100vh"></div>
<script>
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById('isc-error');
  d.style.display='block';
  d.textContent='ERROR: '+msg+'\nLine: '+line+'\n'+(err?err.stack:'');
  return false;
};
</script>

// ── SVG CHARTS with tooltips ──────────────────────────────────────────────────
function StackedBarChart(p){
  var data=p.data,T=p.T;
  var ttState=useState(null),setTt=ttState[1],tt=ttState[0];
  if(!data||!data.length)return el("div",{style:{color:T.sub,fontSize:12,padding:16}},"No data");
  var W=560,LM=145,RM=60,TM=8,BM=28,ROW=28,GAP=10;
  var chartH=data.length*(ROW+GAP)+GAP;
  var H=TM+chartH+BM+24;
  var chartW=W-LM-RM;
  var totals=data.map(function(d){return DISC_TYPES.reduce(function(s,t){return s+(d[t]||0)},0)});
  var maxVal=Math.max.apply(null,totals.concat([1]));
  var ticks=[0,0.25,0.5,0.75,1];
  var usedTypes=DISC_TYPES.filter(function(t){return data.some(function(d){return d[t]>0})});
  var legendRows=Math.ceil(usedTypes.length/3);
  var totalH=H+legendRows*18+10;

  return el("div",{style:{position:"relative"}},
    el("svg",{viewBox:"0 0 "+W+" "+totalH,style:{width:"100%",display:"block"},onMouseLeave:function(){setTt(null)}},
      // Grid
      ticks.map(function(f,i){
        var x=LM+f*chartW;
        return el("g",{key:i},
          el("line",{x1:x,y1:TM,x2:x,y2:TM+chartH,stroke:T.border,strokeDasharray:"3,3",strokeWidth:1}),
          el("text",{x:x,y:TM+chartH+15,textAnchor:"middle",fontSize:9,fill:T.sub},"$"+(f*maxVal>=1e6?((f*maxVal)/1e6).toFixed(1)+"M":f*maxVal>=1e3?((f*maxVal)/1e3).toFixed(0)+"K":"0"))
        );
      }),
      // Bars
      data.map(function(d,ri){
        var y=TM+GAP+ri*(ROW+GAP);
        var xOff=LM;
        var segs=DISC_TYPES.filter(function(t){return d[t]>0}).map(function(t){
          var bw=Math.max((d[t]/maxVal)*chartW,2);
          var seg=el("rect",{
            key:t,x:xOff,y:y,width:bw,height:ROW,fill:DISC_CLR[t]||LC("#64748b"),rx:2,
            style:{cursor:"pointer",opacity:tt&&tt.proj===d.name&&tt.disc===t?1:0.85,transition:"opacity 0.15s"},
            onMouseEnter:function(e){setTt({proj:d.name,disc:t,val:d[t],x:e.clientX,y:e.clientY})},
            onMouseMove:function(e){setTt(function(prev){return prev?Object.assign({},prev,{x:e.clientX,y:e.clientY}):prev})},
          });
          xOff+=bw;
          return seg;
        });
        return el("g",{key:ri},
          el("text",{x:LM-6,y:y+ROW/2+4,textAnchor:"end",fontSize:10,fill:T.sub,fontFamily:"inherit"},d.name),
          segs,
          el("text",{x:xOff+6,y:y+ROW/2+4,fontSize:9,fill:T.sub},totals[ri]?fmtK(totals[ri]):"no value yet")
        );
      }),
      // Legend
      usedTypes.map(function(t,i){
        var col=i%3,row=Math.floor(i/3);
        var lx=LM+(col*(chartW/3));
        var ly=TM+chartH+BM+2+row*18;
        return el("g",{key:t},
          el("rect",{x:lx,y:ly,width:12,height:12,fill:DISC_CLR[t]||LC("#64748b"),rx:2}),
          el("text",{x:lx+16,y:ly+10,fontSize:9,fill:T.sub},t)
        );
      })
    ),
    // Tooltip
    tt&&el("div",{style:{position:"fixed",left:tt.x+12,top:tt.y-10,background:"#0a1628",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",pointerEvents:"none",zIndex:1000,boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}},
      el("div",{style:{fontSize:11,color:T.sub,marginBottom:3}},tt.proj),
      el("div",{style:{fontSize:12,fontWeight:700,color:DISC_CLR[tt.disc]||T.accent}},tt.disc),
      el("div",{style:{fontSize:13,fontWeight:700,color:"#fff",marginTop:2}},fmt(tt.val))
    )
  );
}

function DonutChart(p){
  var data=p.data,T=p.T;
  var ttState=useState(null),setTt=ttState[1],tt=ttState[0];
  if(!data||!data.length)return el("div",{style:{color:T.sub,fontSize:12,padding:16}},"No data");
  var total=data.reduce(function(s,d){return s+d.value},0);
  if(!total)return el("div",{style:{color:T.sub,fontSize:12,padding:16}},"No data");
  var W=200,CX=100,CY=90,R=72,ri=44;
  var angle=-Math.PI/2;
  var slices=data.map(function(d){
    var sweep=(d.value/total)*Math.PI*2;
    var a1=angle,a2=angle+sweep;angle=a2;
    var cos1=Math.cos(a1),sin1=Math.sin(a1),cos2=Math.cos(a2),sin2=Math.sin(a2);
    var lg=sweep>Math.PI?1:0;
    var path="M "+(CX+ri*cos1)+" "+(CY+ri*sin1)+" L "+(CX+R*cos1)+" "+(CY+R*sin1)+" A "+R+" "+R+" 0 "+lg+" 1 "+(CX+R*cos2)+" "+(CY+R*sin2)+" L "+(CX+ri*cos2)+" "+(CY+ri*sin2)+" A "+ri+" "+ri+" 0 "+lg+" 0 "+(CX+ri*cos1)+" "+(CY+ri*sin1)+" Z";
    return {path:path,name:d.name,value:d.value,pct:Math.round(d.value/total*100)};
  });
  var legendH=data.length*15+10;
  return el("div",{style:{position:"relative"}},
    el("svg",{viewBox:"0 0 "+W+" "+(CY*2+legendH),style:{width:"100%",display:"block"},onMouseLeave:function(){setTt(null)}},
      slices.map(function(s,i){
        var isHov=tt&&tt.name===s.name;
        return el("path",{
          key:i,d:s.path,
          fill:DISC_CLR[s.name]||LC("#64748b"),
          stroke:T.card,strokeWidth:2,
          style:{cursor:"pointer",opacity:isHov?1:0.82,transform:isHov?"scale(1.03)":"scale(1)",transformOrigin:CX+"px "+CY+"px",transition:"all 0.15s"},
          onMouseEnter:function(e){setTt({name:s.name,value:s.value,pct:s.pct,x:e.clientX,y:e.clientY})},
          onMouseMove:function(e){setTt(function(prev){return prev?Object.assign({},prev,{x:e.clientX,y:e.clientY}):prev})},
        });
      }),
      el("text",{x:CX,y:CY-7,textAnchor:"middle",fontSize:10,fill:T.sub},"Total"),
      el("text",{x:CX,y:CY+10,textAnchor:"middle",fontSize:13,fontWeight:"bold",fill:T.text},fmtK(total)),
      data.map(function(d,i){
        return el("g",{key:i},
          el("rect",{x:8,y:CY*2+5+i*15,width:11,height:11,fill:DISC_CLR[d.name]||LC("#64748b"),rx:2}),
          el("text",{x:23,y:CY*2+14+i*15,fontSize:9,fill:T.sub},d.name+" ("+Math.round(d.value/total*100)+"%)") 
        );
      })
    ),
    tt&&el("div",{style:{position:"fixed",left:tt.x+12,top:tt.y-10,background:"#0a1628",border:"1px solid "+T.border,borderRadius:8,padding:"8px 12px",pointerEvents:"none",zIndex:1000,boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}},
      el("div",{style:{fontSize:12,fontWeight:700,color:DISC_CLR[tt.name]||T.accent}},tt.name),
      el("div",{style:{fontSize:13,fontWeight:700,color:"#fff",marginTop:2}},fmt(tt.value)),
      el("div",{style:{fontSize:11,color:T.sub,marginTop:2}},tt.pct+"% of pipeline")
    )
  );
}

  var competitor=proj.competitor||"";
  var totalVal=proj.disciplines.reduce(function(s,d){return s+(d.value||0)},0);
  var weightedVal=proj.disciplines.reduce(function(s,d){return s+(d.value||0)*(d.prob||0)},0);
  var lowProbDiscs=proj.disciplines.filter(function(d){return(d.prob||0)<=0.25});
  var missingStakeholders=[];
  if(!proj.alignPlantMgr)missingStakeholders.push("Plant Manager");
  if(!proj.alignOps)missingStakeholders.push("Operations");
  if(!proj.alignProcurement)missingStakeholders.push("Procurement/Finance");

  // SITUATION questions
  tips.situation.push("Ask: \"How long has the current "+pain.toLowerCase().replace("system obsolescence","control system")+" issue been affecting operations?\"");
  tips.situation.push("Map the full stakeholder org chart before your next visit. You're missing: "+(missingStakeholders.length?missingStakeholders.join(", "):"all covered — good."));
  if(proj.endUser&&proj.client&&proj.endUser!==proj.client)
    tips.situation.push("Clarify the EPC/End-User dynamic: "+proj.client+" is EPC but "+proj.endUser+" is the decision-maker. Ensure you have direct access to the end-user, not just the contractor.");

  // PROBLEM questions
  if(pain.toLowerCase().includes("obsolesc")||pain.toLowerCase().includes("spare"))
    tips.problem.push("SPIN Problem: \"What happens when you can't source a replacement card for the existing system? How much downtime did that cause last year?\"");
  if(pain.toLowerCase().includes("downtime"))
    tips.problem.push("SPIN Problem: \"What is the cost per hour of unplanned downtime at this plant? How many hours did you lose last quarter?\"");
  if(pain.toLowerCase().includes("new system")||pain.toLowerCase().includes("new project"))
    tips.problem.push("SPIN Problem: \"What are the top three risks you want this new system to eliminate from day one?\"");
  if(lowProbDiscs.length)
    tips.problem.push("You have "+lowProbDiscs.length+" discipline(s) at 25% win probability ("+lowProbDiscs.map(function(d){return d.type}).join(", ")+"). The problem hasn't been fully validated for these scopes — go back and confirm the pain before pricing.");

  // IMPLICATION questions
  tips.implication.push("SPIN Implication: \"If this project gets delayed another 6 months, what's the cumulative cost impact on production and maintenance budget?\"");
  if(competitor)
    tips.implication.push("Competitor "+competitor+" is in play. Ask: \"What concerns do you have about "+competitor+" regarding long-term local support and spare parts availability in Jordan?\" Make the implication of the wrong choice visible.");
  if(missingStakeholders.includes("Plant Manager"))
    tips.implication.push("Plant Manager not engaged. Ask the operations contact: \"Would the Plant Manager be affected if this project stalls? Can we arrange a brief session?\" Missing PM = slow approvals.");
  if(missingStakeholders.includes("Procurement/Finance"))
    tips.implication.push("Finance not aligned. Before submitting a formal offer, ask: \"Is the budget for this scope already approved, or does it still need financial sign-off?\" Surprises here kill deals late.");

  // NEED-PAYOFF
  tips.needPayoff.push("SPIN Need-Payoff: \"If we solve ["+pain+"] with a system that has local Jordanian support and 48-hour response time, what would that mean for your annual maintenance budget?\"");
  tips.needPayoff.push("Frame ROI: Total project value is "+fmt(totalVal)+". Weighted at "+fmt(weightedVal)+". Build a one-page business case showing 5-year TCO advantage over the incumbent.");
  if(stage==="Offering"||stage==="Technical Clarification")
    tips.needPayoff.push("You're at "+stage+" stage — now is the time to shift conversation from price to value. Ask: \"What is worth more to you: saving 5% on hardware, or having a system your engineers can support locally without flying in a specialist?\"");

  // Consultative
  tips.consultative.push("Consultative Move: Don't just answer their RFQ. Propose a technical workshop or site walkthrough to \"validate the scope together\" — this positions you as a partner, not a vendor.");
  if(stage==="Lead"||stage==="Budgetary")
    tips.consultative.push("Early stage: resist the urge to send a formal offer. Send a \"Technical Concept Note\" first — it shows expertise and starts a dialogue without committing to a price.");
  if(totalVal>500000)
    tips.consultative.push("Deal size is "+fmt(totalVal)+". At this value, a procurement-only relationship will kill your margin. You need a champion at the engineering/operations level. Who is yours right now?");

  return tips;
}

function leadSpinTips(lead){
  var tips=[];
  var stage=lead.status||"";
  var pain=lead.painPoint||"";
  var urgency=lead.urgency||"";
  var score=lead.score||0;

  if(!lead.painConfirmed)
    tips.push({type:"S","tip":"SITUATION: Pain not yet confirmed. Before your next contact, prepare 3 situation questions to uncover the real operational impact of \""+pain+"\". Don't assume it's a real pain until they tell you it costs them money."});
  else
    tips.push({type:"P","tip":"Pain confirmed. Now move to PROBLEM questions: \"How long has this been affecting you? What workarounds are you using today? What happens if it's not fixed this year?\""});

  if(!lead.budgetConfirmed)
    tips.push({type:"I","tip":"IMPLICATION: Budget not confirmed. Ask: \"Is this project in this year's CAPEX budget, or still in the planning phase?\" You must know this before investing time in a detailed offer."});

  if(urgency==="High"&&stage==="New"||urgency==="High"&&stage==="Contacted")
    tips.push({type:"N","tip":"NEED-PAYOFF: High urgency but still in early stage. Accelerate: propose a 30-minute scoping call this week. Frame it as \"I want to make sure we give you the right solution, not just a price.\""});

  if(score<30)
    tips.push({type:"C","tip":"CONSULTATIVE: Score is "+score+"/100 — low qualification. Don't invest heavy technical effort here yet. Make one contact to validate: (1) Is the pain real? (2) Is there a budget owner? (3) What's the timeline?"});
  else if(score>=50)
    tips.push({type:"C","tip":"CONSULTATIVE: Score "+score+"/100 — qualified. Your next move should deepen the relationship, not just quote. Ask for a site visit or a meeting with a second stakeholder."});

  if(lead.competitor)
    tips.push({type:"I","tip":"Competitor \""+lead.competitor+"\" is installed/competing. Your implication question: \"What concerns do you have about their local support capability and upgrade roadmap?\""});

  return tips;
}
